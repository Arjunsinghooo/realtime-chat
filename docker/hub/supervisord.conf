[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20

[program:queue]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autorestart=true
priority=30

[program:reverb]
command=php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080
autorestart=true
priority=40
