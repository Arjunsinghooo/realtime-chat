services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-chat-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    container_name: realtime-chat-mysql
    environment:
      MYSQL_DATABASE: realtime_chat
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: realtime-chat-redis

  nginx:
    image: nginx:alpine
    container_name: realtime-chat-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      
volumes:
  mysql_data: